name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:coverage

  release:
    name: Create SemVer tag
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          latest_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$tag"
            fi
          done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V)

          if [[ -n "$latest_tag" ]]; then
            base_version="${latest_tag#v}"
          else
            base_version="$(node -p "require('./package.json').version")"
          fi

          if [[ ! "$base_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid base SemVer: $base_version" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if [[ "$BEFORE" =~ ^0+$ ]]; then
            commit_range="$AFTER"
          else
            commit_range="$BEFORE..$AFTER"
          fi

          bump_level=0
          # Conventional Commits: feat = minor, fix/perf = patch, ! or BREAKING CHANGE = major.
          breaking_header_regex='^[[:alpha:]][[:alnum:]-]*(\([^)]*\))?!:'
          feat_header_regex='^feat(\([^)]*\))?:'
          patch_header_regex='^(fix|perf)(\([^)]*\))?:'
          while IFS= read -r subject; do
            if [[ "$subject" =~ $breaking_header_regex ]]; then
              bump_level=3
            elif [[ "$subject" =~ $feat_header_regex ]] && (( bump_level < 2 )); then
              bump_level=2
            elif [[ "$subject" =~ $patch_header_regex ]] && (( bump_level < 1 )); then
              bump_level=1
            fi
          done < <(git log --format='%s' "$commit_range")

          commit_bodies="$(git log --format='%b' "$commit_range")"
          if [[ "$commit_bodies" == *"BREAKING CHANGE:"* || "$commit_bodies" == *"BREAKING-CHANGE:"* ]]; then
            bump_level=3
          fi

          if (( bump_level == 0 )); then
            echo "No explicit SemVer bump found; using patch."
            bump_level=1
          fi

          case "$bump_level" in
            3) major=$((major + 1)); minor=0; patch=0 ;;
            2) minor=$((minor + 1)); patch=0 ;;
            1) patch=$((patch + 1)) ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          echo "next tag: $next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "$TAG"
